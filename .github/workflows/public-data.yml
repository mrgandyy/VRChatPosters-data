name: Publish world data
on:
  push:
    branches: [main]
    paths-ignore: ['wreckshop-service/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-world-data
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage public world assets
        run: |
          mkdir _site
          cp ./*.json ./*.txt _site/
          for folder in atlases billboards backdrops default-posters poster_uploads; do
            if [ -d "$folder" ]; then cp -R "$folder" _site/; fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy verified static files
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Back off after Pages failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: retry
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Back off before final attempt
        if: steps.retry.outcome == 'failure'
        run: sleep 60
      - name: Final Pages deployment attempt
        if: steps.retry.outcome == 'failure'
        id: final
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
