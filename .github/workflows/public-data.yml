name: Publish world data
on:
  push:
    branches: [main]
    paths-ignore: ['wreckshop-service/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-world-data
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage public world assets
        run: |
          mkdir _site
          cp ./*.json ./*.txt _site/
          for folder in atlases billboards backdrops default-posters poster_uploads; do
            if [ -d "$folder" ]; then cp -R "$folder" _site/; fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy verified static files
        id: deployment
        uses: actions/deploy-pages@v4
